name: Dock width Chromium regression
on:
  pull_request:
    paths: ['index.html', 'tests/dock-width.cjs', '.github/workflows/dock-width.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: mkdir -p screenshots
      - run: python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/site.log 2>&1 &
      - run: node tests/dock-width.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dock-width-screenshots
          path: screenshots/
